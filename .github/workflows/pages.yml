name: Deploy Web build to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and Web export templates
        working-directory: ${{ runner.temp }}
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          mv templates/web_* templates/version.txt "$dest/"
          echo "GODOT=$PWD/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Export Web build
        run: |
          mkdir -p build/web
          "$GODOT" --headless --path . --import || true
          "$GODOT" --headless --path . --export-release "Web" build/web/index.html
          ls -la build/web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
